name: Validate Antigravity Fork

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Verify POSIX prerequisites
        run: |
          test "$BASH_VERSINFO" -ge 4
          command -v git find sort realpath readlink grep awk
          python3 -c "import sys; assert sys.version_info >= (3, 10), 'Python 3.10+ is required'"

      - name: Test upstream synchronization behavior
        run: node --test .github/upstream-sync/tests/*.test.mjs

      - name: Validate direct Agent home layout
        run: node .github/upstream-sync/validate.mjs

  validate-windows-install:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Verify Python prerequisite
        shell: pwsh
        run: python -c "import sys; assert sys.version_info >= (3, 10), 'Python 3.10+ is required'"

      - name: Test synchronization and validate Windows checkout
        shell: pwsh
        run: |
          node --test .github/upstream-sync/tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .github/upstream-sync/validate.mjs

      - name: Test PowerShell project installation
        shell: pwsh
        run: |
          .github/upstream-sync/tests/local-setup-win.test.ps1
          .github/upstream-sync/tests/local-setup-win-safety.test.ps1

      - name: Test Windows PowerShell 5.1 project installation
        shell: powershell
        run: |
          .github/upstream-sync/tests/local-setup-win.test.ps1
          .github/upstream-sync/tests/local-setup-win-safety.test.ps1
