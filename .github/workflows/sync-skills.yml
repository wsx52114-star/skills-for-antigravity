name: Sync All Skills

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      source:
        description: Source to check; all checks every source
        type: choice
        default: all
        options: [all, upstream, security-audit, i-have-adhd, taiwan-terminology, emil-skills]

permissions:
  contents: write

jobs:
  select-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sources: ${{ steps.select.outputs.sources }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Select sources
        id: select
        env:
          SOURCE: ${{ inputs.source || 'all' }}
        run: node .github/skill-sync/sync.mjs matrix --source "$SOURCE"

  sync:
    needs: select-sources
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.select-sources.outputs.sources) }}
    uses: ./.github/workflows/sync-source.yml
    with:
      source: ${{ matrix.source }}
    secrets:
      SYNC_PR_TOKEN: ${{ secrets.SYNC_PR_TOKEN }}
